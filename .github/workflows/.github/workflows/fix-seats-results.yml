
name: Fix Constituency Filters and Election Results

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-game:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout playable game
        uses: actions/checkout@v4
        with:
          ref: automation/ui-1

      - name: Download verified 2024 constituency list
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/DineshS06/Samadhan/89eece370e281a60c80f817a1c08a70228cc98f1/frontend/src/data/constituencyData.js" \
            -o /tmp/constituencyData.js

      - name: Update constituency data
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          source = Path("/tmp/constituencyData.js").read_text(
              encoding="utf-8"
          )

          pattern = r'^  "([^"]+)": \[(.*?)^  \],?$'
          matches = re.findall(
              pattern, source, flags=re.MULTILINE | re.DOTALL
          )

          roster = []
          for state, block in matches:
              names = re.findall(r'"([^"]+)"', block)
              for name in names:
                  roster.append((state, name))

          if len(roster) != 543:
              raise SystemExit(
                  f"Expected 543 constituencies, found {len(roster)}"
              )

          if len(set(roster)) != 543:
              raise SystemExit("Duplicate state/constituency records")

          path = Path("src/data/constituencies.json")
          old = json.loads(path.read_text(encoding="utf-8"))

          if len(old) != 543:
              raise SystemExit("Existing 543-seat data check failed")

          updated = []
          for previous, (state, name) in zip(old, roster):
              seat = dict(previous)
              seat["name"] = name
              seat["state"] = state
              updated.append(seat)

          path.write_text(
              json.dumps(updated, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          assert len(updated) == 543
          assert len({s["id"] for s in updated}) == 543
          assert len({
              c["id"] for s in updated for c in s["candidates"]
          }) == 1629

          print("PASS: 543 constituencies and 1,629 candidate IDs")
          print("Candidate names still need verified election data.")
          PY

      - name: Add state filters and show all results
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main.js")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              'let selectedSeat = "seat-001";',
              'let selectedSeat = "seat-001";\n'
              'let selectedState = "";\n'
              'let selectedResultState = "";'
          )

          start = text.index("function renderTickets() {")
          end = text.index("function renderFund() {", start)

          tickets = r'''function renderTickets() {
            const states = [...new Set(seats.map(s => s.state))].sort();
            const filtered = selectedState
              ? seats.filter(s => s.state === selectedState)
              : [];
            const seat = filtered.find(s => s.id === selectedSeat);
            const ticket = seat ? state.tickets[seat.id] : null;

            app.innerHTML = `
              <h1>टिकट आवंटन</h1>
              <div class="card">
                <label for="stateSelect">पहले राज्य चुनें</label>
                <select id="stateSelect">
                  <option value="">राज्य चुनें</option>
                  ${states.map(s => `<option value="${escapeHTML(s)}" ${s === selectedState ? "selected" : ""}>${escapeHTML(s)}</option>`).join("")}
                </select>

                ${selectedState ? `
                  <label for="seatSelect">निर्वाचन क्षेत्र चुनें</label>
                  <select id="seatSelect">
                    ${filtered.map(s => `<option value="${s.id}" ${s.id === selectedSeat ? "selected" : ""}>${escapeHTML(s.name)}</option>`).join("")}
                  </select>
                ` : '<p>सीटों की सूची देखने के लिए पहले राज्य चुनें।</p>'}

                ${seat ? `
                  <p class="muted">निर्वाचन क्षेत्र: ${escapeHTML(seat.name)}, ${escapeHTML(seat.state)}</p>
                  <label for="candidateSelect">उम्मीदवार</label>
                  <select id="candidateSelect">
                    ${seat.candidates.map(c => `<option value="${c.id}" ${ticket === c.id ? "selected" : ""}>${escapeHTML(c.name)} — ${escapeHTML(c.id)}</option>`).join("")}
                  </select>
                  <button class="primary" id="assignTicket">टिकट आवंटित करो</button>
                ` : ""}

                <button id="autoTickets">बाकी सभी सीटों पर ऑटो आवंटन</button>
                <p>आवंटित टिकट: ${Object.keys(state.tickets).length} / ${seats.length}</p>
              </div>
              <div class="card">
                <p>कुल निर्वाचन क्षेत्र: ${seats.length}</p>
                <p class="warning">उम्मीदवारों के वास्तविक नामों का सत्यापित डेटा अभी जोड़ना बाकी है।</p>
              </div>`;
          }

          '''
          text = text[:start] + tickets + text[end:]

          start = text.index("function renderResults() {")
          end = text.index("function allocateAllAutomatically() {", start)

          results_function = r'''function renderResults() {
            if (!results) {
              app.innerHTML = `
                <h1>लोकसभा चुनाव</h1>
                <div class="card">
                  <p>चुनाव सिमुलेशन अभी चलाया नहीं गया है।</p>
                  <p>यह शुरुआती सिमुलेशन है, वास्तविक चुनाव पूर्वानुमान नहीं।</p>
                  <button class="primary" id="runElection">चुनाव सिमुलेशन चलाओ</button>
                </div>`;
              return;
            }

            const wins = results.filter(r => r.winnerIsPlayer).length;
            const majority = Math.floor(543 / 2) + 1;
            const states = [...new Set(seats.map(s => s.state))].sort();

            const selectedResults = selectedResultState
              ? results.filter(r => {
                  const seat = seats.find(s => s.id === r.id);
                  return seat && seat.state === selectedResultState;
                })
              : [];

            app.innerHTML = `
              <h1>चुनाव परिणाम</h1>
              <div class="grid">
                ${metric("कुल सीटें", results.length)}
                ${metric("तुम्हारी पार्टी की सीटें", wins)}
                ${metric("बहुमत का आँकड़ा", majority)}
              </div>
              <div class="card">
                <h2>${wins >= majority ? "बहुमत का आँकड़ा पूरा" : "बहुमत नहीं मिला"}</h2>
                <p>यह परिणाम प्रोटोटाइप के सिमुलेशन का है।</p>
                <label for="resultStateSelect">राज्य चुनें</label>
                <select id="resultStateSelect">
                  <option value="">राज्य चुनें</option>
                  ${states.map(s => `<option value="${escapeHTML(s)}" ${s === selectedResultState ? "selected" : ""}>${escapeHTML(s)}</option>`).join("")}
                </select>
                ${selectedResultState
                  ? `<p>${escapeHTML(selectedResultState)}: ${selectedResults.length} सीटों के नतीजे</p>`
                  : "<p>किसी राज्य के नतीजे देखने के लिए पहले राज्य चुनें।</p>"}
                <button id="resetResults">नतीजे हटाकर फिर तैयारी करो</button>
              </div>
              ${selectedResultState ? `
                <div class="card">
                  <h2>${escapeHTML(selectedResultState)} के सभी नतीजे</h2>
                  ${selectedResults.map(r => `
                    <p><strong>${escapeHTML(r.name)}</strong>: ${escapeHTML(r.winnerName)} — जीत का अंतर ${r.margin}</p>
                  `).join("") || "<p>इस राज्य के नतीजे उपलब्ध नहीं हैं।</p>"}
                </div>
              ` : ""}
            `;
          }

          '''
          text = text[:start] + results_function + text[end:]

          old_listener = '''  if (event.target.id === "seatSelect") {
              selectedSeat = event.target.value;
              render();
            }'''

          new_listener = '''  if (event.target.id === "stateSelect") {
              selectedState = event.target.value;
              const firstSeat = seats.find(s => s.state === selectedState);
              selectedSeat = firstSeat ? firstSeat.id : "";
              render();
            }

            if (event.target.id === "seatSelect") {
              selectedSeat = event.target.value;
              render();
            }

            if (event.target.id === "resultStateSelect") {
              selectedResultState = event.target.value;
              render();
            }'''

          if old_listener not in text:
              raise SystemExit("Could not locate existing seat filter listener")

          text = text.replace(old_listener, new_listener)

          text = text.replace(
              'name: seat.name,\n              winnerName:',
              'name: seat.name,\n              winnerName:'
          )

          path.write_text(text, encoding="utf-8")
          print("PASS: added state-first filters and full state result lists")
          PY

      - name: Validate code and data
        run: |
          node --check src/main.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          seats = json.loads(
              Path("src/data/constituencies.json").read_text(
                  encoding="utf-8"
              )
          )

          assert len(seats) == 543
          assert len({s["id"] for s in seats}) == 543
          assert len({(s["state"], s["name"]) for s in seats}) == 543
          assert len({c["id"] for s in seats for c in s["candidates"]}) == 1629
          assert all(len(s["candidates"]) == 3 for s in seats)

          js = Path("src/main.js").read_text(encoding="utf-8")
          assert "results.slice(0, 20)" not in js
          assert 'id="resultStateSelect"' in js
          assert 'id="stateSelect"' in js

          print("PASS: 543 seats, 1,629 unique IDs, state filters")
          PY

      - name: Commit fixes to a new branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automation/fixes-${GITHUB_RUN_NUMBER}"
          git checkout -b "$BRANCH"
          git add src/main.js src/data/constituencies.json
          git commit -m "Add real constituency names and state filters"
          git push origin "$BRANCH"
          echo "Created branch: $BRANCH"
          
