
name: Build Party Ticket and Finance Systems

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout foundation
        uses: actions/checkout@v4
        with:
          ref: automation/foundation-1

      - name: Generate game systems
        run: |
          mkdir -p src/core src/data

          cat > package.json <<'EOF'
          {
            "name": "politics-simulator-india",
            "private": true,
            "type": "module",
            "scripts": {
              "test:systems": "node tests/systems.test.js"
            }
          }
          EOF

          cat > src/core/party-manager.js <<'EOF'
          export function createParty({
            id,
            name,
            ideology = "Unspecified",
            fund = 1000
          }) {
            if (!id || !name?.trim()) {
              throw new Error("Party ID and name are required");
            }

            if (!Number.isFinite(fund) || fund < 0) {
              throw new Error("Invalid party fund");
            }

            return {
              id,
              name: name.trim(),
              ideology,
              fund,
              seatsWon: 0
            };
          }

          export function validateParties(parties) {
            const ids = parties.map(p => p.id);

            if (new Set(ids).size !== ids.length) {
              throw new Error("Duplicate party IDs");
            }

            return true;
          }
          EOF

          cat > src/core/ticket-allocation.js <<'EOF'
          export function allocateTicket(seats, seatId, candidateId) {
            const seat = seats.find(s => s.id === seatId);

            if (!seat) throw new Error("Seat not found");

            const candidate = seat.candidates.find(
              c => c.id === candidateId
            );

            if (!candidate) {
              throw new Error("Candidate does not belong to this seat");
            }

            const alreadyUsed = seats.some(s =>
              s.id !== seatId &&
              s.candidates.some(c =>
                c.id === candidateId && c.ticketed === true
              )
            );

            if (alreadyUsed) {
              throw new Error("Candidate already has a ticket");
            }

            seat.candidates.forEach(c => {
              c.ticketed = c.id === candidateId;
            });

            seat.ticketedCandidateId = candidateId;
            return seat;
          }

          export function autoAllocateTickets(seats, partyId) {
            const used = new Set();

            return seats.map(seat => {
              const eligible = seat.candidates
                .filter(c => !used.has(c.id))
                .sort((a, b) =>
                  (Number(b.popularity) || 0) -
                  (Number(a.popularity) || 0)
                );

              const candidate = eligible[0];

              if (!candidate) {
                throw new Error(
                  `No eligible candidate for ${seat.id}`
                );
              }

              used.add(candidate.id);

              return {
                ...seat,
                candidates: seat.candidates.map(c => ({
                  ...c,
                  ticketed: c.id === candidate.id
                })),
                ticketedCandidateId: candidate.id,
                ticketedPartyId: partyId
              };
            });
          }
          EOF

          cat > src/core/finance-ledger.js <<'EOF'
          export function createLedger(initialBalance = 1000) {
            if (!Number.isFinite(initialBalance) ||
                initialBalance < 0) {
              throw new Error("Invalid initial balance");
            }

            return {
              balance: initialBalance,
              transactions: []
            };
          }

          export function recordTransaction(
            ledger,
            { type, amount, description }
          ) {
            if (!["income", "expense"].includes(type)) {
              throw new Error("Type must be income or expense");
            }

            if (!Number.isFinite(amount) || amount <= 0) {
              throw new Error("Amount must be positive");
            }

            if (type === "expense" && amount > ledger.balance) {
              throw new Error("Insufficient funds");
            }

            const change = type === "income" ? amount : -amount;

            return {
              balance: ledger.balance + change,
              transactions: [
                ...ledger.transactions,
                {
                  type,
                  amount,
                  description: description || "",
                  balanceAfter: ledger.balance + change,
                  timestamp: new Date().toISOString()
                }
              ]
            };
          }
          EOF

          cat > src/data/game-config.json <<'EOF'
          {
            "currency": "INR crore",
            "startingPartyFund": 1000,
            "lokSabhaSeats": 543,
            "candidatesPerSeat": 3,
            "ticketMode": ["manual", "automatic", "mixed"]
          }
          EOF

          mkdir -p tests

          cat > tests/systems.test.js <<'EOF'
          import assert from "node:assert/strict";
          import { createParty, validateParties }
            from "../src/core/party-manager.js";
          import { createLedger, recordTransaction }
            from "../src/core/finance-ledger.js";
          import { allocateTicket, autoAllocateTickets }
            from "../src/core/ticket-allocation.js";

          const party = createParty({
            id: "party-1",
            name: "Test Party"
          });

          assert.equal(party.fund, 1000);
          assert.equal(validateParties([party]), true);

          const ledger = createLedger(1000);
          const afterExpense = recordTransaction(ledger, {
            type: "expense",
            amount: 100,
            description: "Campaign"
          });

          assert.equal(afterExpense.balance, 900);

          assert.throws(() => recordTransaction(afterExpense, {
            type: "expense",
            amount: 2000
          }));

          const seats = [
            {
              id: "seat-001",
              candidates: [
                { id: "c1", popularity: 20 },
                { id: "c2", popularity: 80 },
                { id: "c3", popularity: 40 }
              ]
            },
            {
              id: "seat-002",
              candidates: [
                { id: "c4", popularity: 60 },
                { id: "c5", popularity: 30 },
                { id: "c6", popularity: 10 }
              ]
            }
          ];

          allocateTicket(seats, "seat-001", "c1");
          assert.equal(seats[0].ticketedCandidateId, "c1");

          const automatic = autoAllocateTickets(seats, "party-1");
          assert.equal(automatic.length, 2);
          assert.equal(
            new Set(automatic.map(s => s.ticketedCandidateId)).size,
            2
          );

          console.log("PASS: party, ticket and finance tests");
          EOF

          node tests/systems.test.js

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("src/data/constituencies.json")
          if not p.exists():
              raise SystemExit("Foundation constituency data missing")

          seats = json.loads(p.read_text(encoding="utf-8"))
          assert len(seats) == 543
          assert all(len(s["candidates"]) == 3 for s in seats)

          ids = [
              c["id"] for s in seats for c in s["candidates"]
          ]
          assert len(ids) == 1629
          assert len(set(ids)) == 1629

          print("PASS: existing 543-seat data preserved")
          PY

      - name: Commit systems on a new branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="automation/systems-${GITHUB_RUN_NUMBER}"
          git checkout -b "$BRANCH"
          git add package.json src/core src/data tests
          git commit -m "Add party ticket and finance systems"
          git push origin "$BRANCH"
          
